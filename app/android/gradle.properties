# Kept deliberately small: the Flutter template default of -Xmx8G here
# (plus a separate Kotlin daemon JVM and dartvm all running at once) is
# oversized for a low-memory build machine and can cause real OOM/thrashing.
# These values leave headroom for the Kotlin daemon + dartvm + OS on modest
# hardware - raise them if building on a machine with more RAM to spare.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx512m,-XX:MaxMetaspaceSize=256m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
