# Kept deliberately small: Aspire (the build machine for this project) is a
# ~2006 Core 2 Duo laptop with only 2.9GB RAM total. The Flutter template's
# default of -Xmx8G here (plus a separate Kotlin daemon JVM and dartvm all
# running at once) caused real OOM/thrashing incidents (2026-08-28,
# 2026-08-31) - the machine became unresponsive even to new SSH connections
# for extended periods, once needing a manual power-cycle. These values are
# sized to leave headroom for the Kotlin daemon + dartvm + OS on this
# specific machine, not a generic default - raise them if this project ever
# moves to stronger hardware.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx512m,-XX:MaxMetaspaceSize=256m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
